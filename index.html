<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Свой Чат</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #1e1f22; color: #dbdee1; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    .header { background: #2b2d31; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid #111214; }
    input, button { padding: 8px 12px; border-radius: 6px; border: none; font-size: 14px; }
    input { background: #383a40; color: #fff; outline: none; }
    button { background: #5865f2; color: #fff; cursor: pointer; font-weight: bold; }
    button:hover { background: #4752c4; }
    .call-btn { background: #23a55a; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 75%; padding: 8px 12px; border-radius: 8px; word-break: break-word; }
    .me { background: #5865f2; color: #fff; align-self: flex-end; }
    .friend { background: #2b2d31; align-self: flex-start; }
    .sys { color: #949ba4; font-size: 12px; text-align: center; align-self: center; }
    .footer { background: #2b2d31; padding: 12px; display: flex; gap: 8px; }
    .footer input { flex: 1; }
  </style>
</head>
<body>

  <div class="header">
    <span>Мой ID: <b id="my-id">...</b></span>
    <input type="text" id="friend-id" placeholder="ID друга">
    <button onclick="connectToFriend()">Подключиться</button>
    <button class="call-btn" onclick="startCall()">🎤 Позвонить</button>
    <audio id="remote-audio" autoplay></audio>
  </div>

  <div id="chat">
    <div class="sys">Скопируйте свой ID и отправьте другу, чтобы начать общение.</div>
  </div>

  <div class="footer">
    <input type="text" id="msg-input" placeholder="Написать сообщение..." onkeypress="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()">Отправить</button>
  </div>

  <script>
    // Генерируем короткий случайный ID
    const randomId = 'user-' + Math.floor(1000 + Math.random() * 9000);
    const peer = new Peer(randomId);
    let conn = null;

    peer.on('open', id => {
      document.getElementById('my-id').innerText = id;
    });

    // Входящее текстовое подключение
    peer.on('connection', connection => {
      conn = connection;
      setupChat();
      addLog('Друг подключился к чату!', 'sys');
    });

    // Входящий голосовой звонок
    peer.on('call', call => {
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        call.answer(stream);
        call.on('stream', remoteStream => {
          document.getElementById('remote-audio').srcObject = remoteStream;
          addLog('Голосовая связь установлена 🔊', 'sys');
        });
      });
    });

    function connectToFriend() {
      const friendId = document.getElementById('friend-id').value.trim();
      if (!friendId) return;
      conn = peer.connect(friendId);
      conn.on('open', () => {
        setupChat();
        addLog('Вы подключились к ' + friendId, 'sys');
      });
    }

    function setupChat() {
      conn.on('data', data => addLog(data, 'friend'));
    }

    function sendMsg() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !conn) return;
      conn.send(text);
      addLog(text, 'me');
      input.value = '';
    }

    function startCall() {
      const friendId = document.getElementById('friend-id').value.trim() || (conn && conn.peer);
      if (!friendId) return alert('Сначала введите ID друга!');
      navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        const call = peer.call(friendId, stream);
        call.on('stream', remoteStream => {
          document.getElementById('remote-audio').srcObject = remoteStream;
          addLog('Голосовая связь установлена 🔊', 'sys');
        });
      }).catch(() => alert('Для работы микрофона откройте сайт через HTTPS (например, GitHub Pages).'));
    }

    function addLog(text, type) {
      const div = document.createElement('div');
      div.className = 'msg ' + type;
      div.innerText = text;
      const chat = document.getElementById('chat');
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
